<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagem enviada — VoxCidade</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul:#1054A8; --azul2:#1976D2; --azulbg:#E8F4FD;
      --amarelo:#F5A800; --verde:#2E7D32; --verdebg:#E8F5E9;
      --escuro:#0D1B2A; --cinza:#5A6A7A; --branco:#FFFFFF;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'DM Sans',sans-serif;
      background:linear-gradient(135deg,#0D1B2A 0%,#1054A8 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px;
    }
    .card{
      background:#fff; border-radius:32px; padding:56px 48px;
      max-width:520px; width:100%; text-align:center;
      box-shadow:0 32px 80px rgba(0,0,0,0.3);
      animation:fadeUp .6s ease both;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .logo{width:80px;margin:0 auto 24px;display:block}
    .check-circle{
      width:72px;height:72px;border-radius:50%;
      background:var(--verdebg);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 24px; font-size:36px;
      animation:pop .5s ease .3s both;
    }
    @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
    h1{
      font-family:'Fraunces',serif;font-weight:900;
      font-size:32px;color:var(--escuro);margin-bottom:16px;line-height:1.15;
    }
    .destaque{color:var(--azul)}
    p{font-size:17px;color:var(--cinza);line-height:1.7;margin-bottom:32px}
    .btn-voltar{
      display:inline-flex;align-items:center;gap:10px;
      background:var(--azul);color:#fff;
      border-radius:50px;padding:14px 32px;
      font-weight:700;font-size:16px;text-decoration:none;
      transition:background .2s,transform .2s;
      box-shadow:0 8px 24px rgba(16,84,168,0.3);
    }
    .btn-voltar:hover{background:var(--azul2);transform:translateY(-2px)}
    .btn-home{
      display:inline-flex;align-items:center;gap:10px;
      background:transparent;color:var(--cinza);
      border:1px solid rgba(90,106,122,0.3);
      border-radius:50px;padding:14px 32px;
      font-weight:600;font-size:16px;text-decoration:none;
      transition:border-color .2s,color .2s;margin-left:12px;
    }
    .btn-home:hover{border-color:var(--azul);color:var(--azul)}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .rodape{margin-top:32px;padding-top:24px;border-top:1px solid #f0f0f0;font-size:13px;color:#bbb}
    @media(max-width:500px){.card{padding:40px 28px}.btn-home{margin-left:0}}
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.jpg" alt="VoxCidade" class="logo">
    <div class="check-circle">✅</div>
    <h1>Mensagem enviada<br>com <span class="destaque">sucesso!</span></h1>
    <p>
      Obrigado por entrar em contato com o <strong>VoxCidade</strong>.<br>
      Nossa equipe analisará sua mensagem e retornará em até <strong>2 dias úteis</strong>.<br><br>
      Juntos, construímos cidades melhores. 🏙️
    </p>
    <div class="btns">
      <a href="index.html#contato" class="btn-voltar">← Voltar ao site</a>
      <a href="index.html" class="btn-home">🏠 Página inicial</a>
    </div>
    <p class="rodape">VoxCidade — Sua cidade, sua voz.<br>voxcidade@terra.com.br</p>
  </div>
</body>
</html>
